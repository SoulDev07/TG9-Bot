[project]
name = "tg9-bot"
version = "0.2.0"
description = "A modern, general-purpose, plug-and-play Discord bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.7.0",
    "aiohttp>=3.11.0",
    "aiosqlite>=0.22.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.2.0",
    "structlog>=25.1.0",
    "sentry-sdk[aiohttp]>=2.50.0",
    "humanize>=4.15.0",
    "aiocache>=0.12.3",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.15.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "RUF012",
    "SIM105",
    "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
